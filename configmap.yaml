apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  # Non-secret configuration shared across services.
  NODE_ENV: "production"
  USER_SERVICE_URL: "http://user-service:4001"
  PRODUCT_SERVICE_URL: "http://product-service:4002"
  ORDER_SERVICE_URL: "http://order-service:4003"
  JWT_EXPIRES_IN: "24h"
  DB_HOST_USER: "postgres-user"
  DB_HOST_ORDER: "postgres-order"
  DB_PORT: "5432"
  USER_DB_NAME: "userdb"
  ORDER_DB_NAME: "orderdb"
  # Baked into the frontend bundle at build time - see frontend/Dockerfile.
  # Point this at whatever hostname/ingress the browser will actually use.
  VITE_API_BASE_URL: "http://api.ecommerce.local"
