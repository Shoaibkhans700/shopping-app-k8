apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-user-pvc
  namespace: ecommerce
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp2
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-user
  namespace: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres-user }
  template:
    metadata:
      labels: { app: postgres-user }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: "userservice" }
            - { name: POSTGRES_DB, value: "userdb" }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: POSTGRES_USER_DB_PASSWORD }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: postgres }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "userservice"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "userservice"] }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-user-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: ecommerce
spec:
  selector: { app: postgres-user }
  ports: [{ port: 5432, targetPort: 5432 }]
