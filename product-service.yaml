apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      containers:
        - name: product-service
          image: 641379500030.dkr.ecr.ap-south-1.amazonaws.com/shop/shopping-app:product-service-14
          ports: [{ containerPort: 4002 }]
          env:
            - { name: PORT, value: "4002" }
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: NODE_ENV } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: MONGO_ROOT_PASSWORD } }
            - name: MONGO_URI
              value: "mongodb://root:$(MONGO_ROOT_PASSWORD)@mongo-product:27017/productdb?authSource=admin"
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: INTERNAL_API_KEY } }
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
spec:
  selector: { app: product-service }
  ports: [{ port: 4002, targetPort: 4002 }]
