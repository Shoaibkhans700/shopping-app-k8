apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: your-registry/order-service:latest
          ports: [{ containerPort: 4003 }]
          env:
            - { name: PORT, value: "4003" }
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: NODE_ENV } }
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: DB_HOST_ORDER } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: ORDER_DB_NAME } }
            - { name: DB_USER, value: "orderservice" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: POSTGRES_ORDER_DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_SECRET } }
            - name: PRODUCT_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: PRODUCT_SERVICE_URL } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: INTERNAL_API_KEY } }
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4003 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  selector: { app: order-service }
  ports: [{ port: 4003, targetPort: 4003 }]
